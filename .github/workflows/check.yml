name: Native builds and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxext-dev libxft-dev libsqlite3-dev
      - run: go test ./...
        env:
          BALANCE_HUD_GUI_SMOKE: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: Build portable archive
        shell: bash
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BalanceHUD-${{ runner.os }}-x64
          path: |
            build/BalanceHUD-ubuntu-x64.tar.gz
            build/BalanceHUD-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
