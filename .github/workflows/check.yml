name: Native builds and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go build -trimpath -ldflags="-s -w" -o balance-hud ./cmd/balance-hud
      - if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o balance-hud.exe ./cmd/balance-hud
